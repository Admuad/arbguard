[package]
name = "arbguard-checker"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.10"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"

# If you need to reduce the binary size, it is advisable to try other
# optimization levels, such as "s" and "z"
opt-level = 3

# Needed for the `stylus_sdk::testing` TestVM harness used by the
# entrypoint tests in `src/lib.rs`. (The `cargo stylus new` template ships
# a test that uses it but does not declare it — without this, `cargo test`
# fails with "unresolved import `stylus_sdk::testing`".)
[dev-dependencies]
stylus-sdk = { version = "0.10.10", features = ["stylus-test"] }

